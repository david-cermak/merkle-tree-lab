[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merkle-tree-lab"
version = "0.1.0"
description = "Hands-on lab for Merkle Tree Certificates with TesseraCT, Python, and PQC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
