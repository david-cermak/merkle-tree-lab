name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show OpenSSL version
        run: openssl version || true

      - name: Install dependencies
        run: python -m pip install --upgrade pip cryptography ruff

      - name: Lint
        run: ruff check lab tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v
      # Note: make tls-demo / make measure need OpenSSL 3.5 (+ oqs-provider for
      # Falcon) and are not run here. The scripts themselves print
      # `openssl version` when you run them locally.
